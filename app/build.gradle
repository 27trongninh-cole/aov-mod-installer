plugins {
    id 'com.android.application'
}

android {
    namespace 'com.modninstaller.kgvn'
    compileSdk 34

    defaultConfig {
        applicationId "com.modninstaller.kgvn"
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "1.0.5"
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'

    // Shizuku
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    // Zip4j — giải nén ZIP có mật khẩu (ZipCrypto + AES) bằng Java thuần,
    // không cần binary unzip ngoài (tránh phụ thuộc vào bản unzip rút gọn
    // của từng ROM Android, vốn không hỗ trợ -P như đã gặp lỗi).
    implementation 'net.lingala.zip4j:zip4j:2.11.5'
}
